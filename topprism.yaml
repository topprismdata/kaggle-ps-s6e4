topprism:
  purpose: learning_project
  capability: tabular_ml
  maturity: learning
  evidence:
    type: kaggle_benchmark
    scope: >-
      PS S6E4 three-class irrigation-need classification with Balanced
      Accuracy metric.
    self_trained_best_public_lb: 0.97785
    externally_assisted_best_public_lb: 0.98150
    notes: >-
      Best reported LB 0.98150 used external prediction sources
      (Schema8 / Nina / Mohit transfer learning). Self-trained best
      was 0.97785. Both numbers preserved; not implied that the
      repository alone produced 0.98150.
  parent:
    - cultivating_ml_agent
  product_relationship: "This is not a customer product."

business_question:
  en: >-
    What reusable ML knowledge can a Cultivating ML Agent crystallize
    from a longitudinal tabular classification competition, including
    self-trained / externally-assisted result distinction, iterative
    pseudo-labeling failure and ensemble-source quality findings?
  zh: >-
    Cultivating ML Agent 在一个长期表格分类竞赛项目中，能把哪些可复用
    的 ML 知识（包括 self-trained 与 externally-assisted 结果区分、
    迭代伪标注失败、集成来源质量发现）结晶下来？

